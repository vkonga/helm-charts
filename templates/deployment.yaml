apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: amazon
  name: nginx
  labels:
    project: amazon-clone
    app: nginx
spec:
  replicas: {{.Values.deployment.replicas}}
  selector:
    matchLabels:
      project: amazon-clone
      app: nginx
  template:
    metadata:
      labels:
        project: amazon-clone
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:{{ .Values.deployment.imageVersion }}